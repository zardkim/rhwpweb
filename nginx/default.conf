# 앞단 TLS 프록시가 준 X-Forwarded-Proto 를 우선, 없으면 현재 스킴 (rhwp-auth 쿠키 Secure 판단용)
map $http_x_forwarded_proto $rhwp_fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    server_tokens off;

    # TLS 종료 프록시 뒤에서 /rhwp -> /rhwp/ 리다이렉트가 http://host:80/ 으로 새지 않게 한다.
    absolute_redirect off;

    # 인증 설정은 컨테이너 시작 시 40-rhwp-auth.sh 가 생성한다 (RHWP_AUTH=request|basic|off).
    # server 레벨에 두어 모든 location 에 상속된다.
    include /etc/nginx/rhwp-auth.d/auth.conf;

    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/css application/json application/manifest+json
               image/svg+xml application/wasm font/ttf font/otf;

    location = /healthz {
        auth_basic off;
        auth_request off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /rhwp/;
    }

    location /rhwp/ {
        # 해시가 없는 진입 파일은 항상 재검증 (서비스 워커 autoUpdate 가 멈추지 않도록)
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /rhwp/index.html;

        # 해시 파일명 -> 장기 캐시 (^~ : 아래 정규식 location 보다 우선)
        location ^~ /rhwp/assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # 브라우저는 manifest·아이콘을 인증 정보 없이(credentials: omit) 가져온다.
        # 인증을 걸면 401 로 PWA 설치가 깨진다. 내용은 앱 이름·아이콘뿐이라 공개해도 무방.
        location = /rhwp/manifest.webmanifest {
            auth_basic off;
            auth_request off;
            types { application/manifest+json webmanifest; }
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }
        # 서비스 워커 스크립트는 업데이트 확인 시 로그아웃 상태에서도 받아져야 한다
        # (RHWP_PWA=0 빌드에서는 예전 서비스 워커를 지우는 kill-switch).
        location = /rhwp/sw.js {
            auth_basic off;
            auth_request off;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }
        location ^~ /rhwp/icons/ {
            auth_basic off;
            auth_request off;
            add_header Cache-Control "public, max-age=604800" always;
            try_files $uri =404;
        }

        location ~* \.wasm$ {
            types { application/wasm wasm; }
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        # 폰트·이미지는 파일명이 바뀌지 않지만 자주 바뀌지도 않는다
        location ~* ^/rhwp/(fonts|images)/ {
            add_header Cache-Control "public, max-age=604800" always;
            try_files $uri =404;
        }

        # 확장자가 있는 정적 파일은 없으면 404 (index.html 로 폴백하지 않음)
        location ~* \.(js|mjs|css|json|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|otf|hwp|hwpx|hml|html|txt)$ {
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }
    }
}
